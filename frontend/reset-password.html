<link rel="stylesheet" href="/static/reset.css">

<section class="reset-page-container">
    <div class="reset-card animate-fade-up">
        
        <!-- 1. HEADER SECTION -->
        <div class="reset-header">
            <div class="security-icon">
                <i class="fa-solid fa-shield-check"></i>
            </div>
            <h2>Create New <span class="highlight">Password</span></h2>
            <p>Your identity has been verified. Please choose a strong password to secure your account.</p>
        </div>

        <!-- 2. THE FORM -->
        <form action="/auth/reset-password" method="POST" id="resetPasswordForm" class="modern-form">
            <!-- CRITICAL: Hidden token to tell the backend which user is resetting -->
            <input type="hidden" name="token" value="{{ token }}">

            <div class="input-stack">
                <div class="field-group">
                    <label>New Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="new_password" id="password" 
                               placeholder="Minimum 8 characters" required minlength="8">
                    </div>
                </div>

                <div class="field-group">
                    <label>Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-check-double"></i>
                        <input type="password" id="confirm_password" 
                               placeholder="Repeat your password" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                Update Password <i class="fa-solid fa-circle-check"></i>
            </button>
        </form>

        <div id="error-msg" class="error-banner" style="display: none;">
            Passwords do not match. Please try again.
        </div>

    </div>
</section>

<!-- Simple Script to ensure passwords match before sending -->
<script>
    const form = document.getElementById('resetPasswordForm');
    const pass = document.getElementById('password');
    const confirmPass = document.getElementById('confirm_password');
    const error = document.getElementById('error-msg');

    form.onsubmit = function(e) {
        if (pass.value !== confirmPass.value) {
            e.preventDefault();
            error.style.display = 'block';
            confirmPass.style.borderColor = '#ff4444';
        }
    };
</script>
