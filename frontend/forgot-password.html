
<link rel="stylesheet" href="/static/forgot.css">

<section class="recovery-wrapper">
    <div class="recovery-card animate-zoom">
        
        <!-- 1. ICON & HEADER -->
        <div class="recovery-top">
            <div class="mail-icon">
                <i class="fa-solid fa-paper-plane"></i>
            </div>
            <h1>Reset <span class="accent-sage">Password</span></h1>
            <p>No worries! Enter your email below and we'll send you a secure link to get back into your account.</p>
        </div>

        <!-- 2. THE FORM (Using AJAX/Fetch for Pro feel) -->
        <form id="recoveryForm" class="recovery-form">
            <div class="input-container">
                <label for="email">Registered Email</label>
                <input type="email" id="email" name="email" placeholder="e.g. rose@example.com" required>
            </div>

            <button type="submit" id="submitBtn" class="primary-btn">
                Send Recovery Link
            </button>
        </form>

        <!-- 3. FEEDBACK AREA -->
        <div id="statusBox" class="status-alert"></div>

        <div class="recovery-footer">
            <span>Remembered it?</span>
            <a href="/login">Back to Login</a>
        </div>
    </div>
</section>

<script>
    document.getElementById('recoveryForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const box = document.getElementById('statusBox');
        const email = document.getElementById('email').value;

        // Visual feedback
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

        try {
            const formData = new FormData();
            formData.append('email', email);

            const response = await fetch('/auth/forgot-password', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();

            // Success state
            box.style.display = 'block';
            box.innerText = data.message;
            box.className = 'status-alert success-bg';
            btn.innerHTML = 'Link Sent!';
            btn.style.background = '#10b981';

        } catch (err) {
            // Error state
            box.style.display = 'block';
            box.innerText = "System error. Please try again later.";
            box.className = 'status-alert error-bg';
            btn.disabled = false;
            btn.innerText = "Retry Sending";
        }
    }
</script>
